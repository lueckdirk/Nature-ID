<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature ID Game</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/modal.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌿 Nature ID Game 🦋</h1>
            <div class="menu-bar">
                <select id="categorySelect">
                    <option value="all">All Species</option>
                    <option value="birds">🐦 Birds</option>
                    <option value="plants">🌱 Plants</option>
                    <option value="insects">🦋 Insects</option>
                    <option value="mammals">🐾 Mammals</option>
                    <option value="fish">🐠 Fish</option>
                    <option value="reptiles">🦎 Reptiles</option>
                    <option value="amphibians">🐸 Amphibians</option>
                    <option value="arachnids">🕷️ Spiders</option>
                    <option value="mollusks">🐌 Mollusks</option>
                    <option value="fungi">🍄 Fungi</option>
                </select>
                <select id="difficultySelect">
                    <option value="easy">Easy (Any Species)</option>
                    <option value="medium">Medium (Same Family)</option>
                    <option value="hard">Hard (Scientific Names)</option>
                </select>
                <select id="regionSelect">
                    <option value="global">Global</option>
                    <optgroup label="US Regions">
                        <option value="northeast">Northeast US</option>
                        <option value="southeast">Southeast US</option>
                        <option value="midwest">Midwest US</option>
                        <option value="southwest">Southwest US</option>
                        <option value="west">Western US</option>
                        <option value="pacific">Pacific Northwest</option>
                    </optgroup>
                    <optgroup label="US States">
                        <option value="AL">Alabama</option>
                        <option value="AK">Alaska</option>
                        <option value="AZ">Arizona</option>
                        <option value="AR">Arkansas</option>
                        <option value="CA">California</option>
                        <option value="CO">Colorado</option>
                        <option value="CT">Connecticut</option>
                        <option value="DE">Delaware</option>
                        <option value="FL">Florida</option>
                        <option value="GA">Georgia</option>
                        <option value="HI">Hawaii</option>
                        <option value="ID">Idaho</option>
                        <option value="IL">Illinois</option>
                        <option value="IN">Indiana</option>
                        <option value="IA">Iowa</option>
                        <option value="KS">Kansas</option>
                        <option value="KY">Kentucky</option>
                        <option value="LA">Louisiana</option>
                        <option value="ME">Maine</option>
                        <option value="MD">Maryland</option>
                        <option value="MA">Massachusetts</option>
                        <option value="MI">Michigan</option>
                        <option value="MN">Minnesota</option>
                        <option value="MS">Mississippi</option>
                        <option value="MO">Missouri</option>
                        <option value="MT">Montana</option>
                        <option value="NE">Nebraska</option>
                        <option value="NV">Nevada</option>
                        <option value="NH">New Hampshire</option>
                        <option value="NJ">New Jersey</option>
                        <option value="NM">New Mexico</option>
                        <option value="NY">New York</option>
                        <option value="NC">North Carolina</option>
                        <option value="ND">North Dakota</option>
                        <option value="OH">Ohio</option>
                        <option value="OK">Oklahoma</option>
                        <option value="OR">Oregon</option>
                        <option value="PA">Pennsylvania</option>
                        <option value="RI">Rhode Island</option>
                        <option value="SC">South Carolina</option>
                        <option value="SD">South Dakota</option>
                        <option value="TN">Tennessee</option>
                        <option value="TX">Texas</option>
                        <option value="UT">Utah</option>
                        <option value="VT">Vermont</option>
                        <option value="VA">Virginia</option>
                        <option value="WA">Washington</option>
                        <option value="WV">West Virginia</option>
                        <option value="WI">Wisconsin</option>
                        <option value="WY">Wyoming</option>
                    </optgroup>
                    <optgroup label="Other Regions">
                        <option value="canada">Canada</option>
                        <option value="uk">United Kingdom</option>
                        <option value="australia">Australia</option>
                        <option value="europe">Europe</option>
                    </optgroup>
                </select>
            </div>
            <div class="score-board">
                <div class="score-item">
                    <div class="score-item-label">Score</div>
                    <div class="score-item-value" id="score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-item-label">Streak</div>
                    <div class="score-item-value" id="streak">0</div>
                </div>
                <div class="score-item">
                    <div class="score-item-label">Total</div>
                    <div class="score-item-value" id="total">0</div>
                </div>
            </div>
            <div class="diversity-section">
                <div class="diversity-grid">
                    <div class="diversity-item">
                        <div class="diversity-item-label">🌍 Species Seen</div>
                        <div class="diversity-item-value" id="speciesSeen">0</div>
                    </div>
                    <div class="diversity-item">
                        <div class="diversity-item-label">✅ Species Learned</div>
                        <div class="diversity-item-value" id="speciesLearned">0</div>
                    </div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="game-area">
            <div class="info-box">
                🦎 Species data from <a href="https://www.inaturalist.org" target="_blank" rel="noopener">iNaturalist</a> - A community of nature enthusiasts
            </div>
            <div id="gameContent">
                <div class="loading">Loading nature data...</div>
            </div>
        </div>
    </div>

    <div id="imageModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="zoom-info">Scroll to zoom, drag to pan</div>
            <div class="modal-image-container" id="modalImageContainer">
                <img id="modalImage" class="modal-image" alt="Enlarged species image">
            </div>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoomOut">-</button>
                <button class="zoom-btn" id="zoomReset">⌂</button>
                <button class="zoom-btn" id="zoomIn">+</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
