            color: white;
            overflow-x: hidden;

        .container {
            max-width: 100%;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #e0e6ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 300px;
            margin: 20px 0;
        }
        
        .score-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .game-area {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .loading {
            text-align: center;
            font-size: 1.2em;
            padding: 40px;
        }
        
        .image-container {
            width: 100%;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .species-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .species-image:hover {
            transform: scale(1.05);
        }
        
        .question {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        .options {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .option {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1.1em;
            backdrop-filter: blur(10px);
        }
        
        .option:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .option.correct {
            background: rgba(76, 175, 80, 0.8);
            border-color: #4CAF50;
            animation: correctPulse 0.6s ease;
        }
        
        .option.incorrect {
            background: rgba(244, 67, 54, 0.8);
            border-color: #f44336;
            animation: shake 0.6s ease;
        }
        
        .option.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        
        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn.secondary {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .feedback {
            text-align: center;
            margin: 20px 0;
            font-size: 1.1em;
            min-height: 25px;
            font-weight: 500;
        }
        
        .settings {
            margin: 20px 0;
            text-align: center;
        }
        
        .settings select {
            padding: 8px 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            margin: 0 10px;
            font-size: 1em;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .streak {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .game-area {
                padding: 20px;
            }
            
            .image-container {
                height: 250px;
            }
            
            .question {
                font-size: 1.1em;
            }
            
            .option {
                padding: 12px 15px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌿 Nature ID Game 🦋</h1>
            <div class="score-board">
                <div class="score-item">
                    <div>Score</div>
                    <div id="score">0</div>
                </div>
                <div class="score-item">
                    <div>Streak</div>
                    <div id="streak">0</div>
                </div>
                <div class="score-item">
                    <div>Total</div>
                    <div id="total">0</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="game-area">
            <div class="settings">
                <select id="categorySelect">
                    <option value="both">Plants & Animals</option>
                    <option value="plants">Plants Only</option>
                    <option value="animals">Animals Only</option>
                </select>
                <select id="difficultySelect">
                    <option value="easy">Easy (Common)</option>
                    <option value="medium">Medium (Mixed)</option>
                    <option value="hard">Hard (Rare)</option>
                </select>
            </div>
            
            <div id="gameContent">
                <div class="loading">Loading nature data...</div>
            </div>
        </div>
    </div>

    <script>
        class NatureGame {
            constructor() {
                this.score = 0;
                this.streak = 0;
                this.total = 0;
                this.currentQuestion = null;
                this.gameContent = document.getElementById('gameContent');
                this.speciesCache = new Map();
                this.usedSpecies = new Set();
                this.categorySelect = document.getElementById('categorySelect');
                this.difficultySelect = document.getElementById('difficultySelect');
                
                this.init();
            }
            
            async init() {
                this.bindEvents();
                await this.loadNextQuestion();
            }
            
            bindEvents() {
                this.categorySelect.addEventListener('change', () => {
                    this.usedSpecies.clear();
                    this.loadNextQuestion();
                });
                
                this.difficultySelect.addEventListener('change', () => {
                    this.usedSpecies.clear();
                    this.loadNextQuestion();
                });
            }
            
            async fetchSpeciesData() {
                const category = this.categorySelect.value;
                const difficulty = this.difficultySelect.value;
                
                // Define search parameters based on selections
                let iconicTaxa = [];
                if (category === 'plants') iconicTaxa = ['Plantae'];
                else if (category === 'animals') iconicTaxa = ['Animalia'];
                else iconicTaxa = ['Plantae', 'Animalia'];
                
                const qualityGrade = difficulty === 'hard' ? 'research' : 'needs_id,research';
                const popular = difficulty === 'easy' ? 'true' : 'false';
                
                try {
                    // Get random observations
                    const randomPage = Math.floor(Math.random() * 100) + 1;
                    const iconicTaxonParam = iconicTaxa.map(t => `iconic_taxa[]=${t}`).join('&');
                    
                    const response = await fetch(
                        `https://api.inaturalist.org/v1/observations?` +
                        `${iconicTaxonParam}&` +
                        `quality_grade=${qualityGrade}&` +
                        `popular=${popular}&` +
                        `photos=true&` +
                        `per_page=30&` +
                        `page=${randomPage}&` +
                        `order=random`
                    );
                    
                    if (!response.ok) throw new Error('API request failed');
                    
                    const data = await response.json();
                    return data.results;
                } catch (error) {
                    console.error('Error fetching data:', error);
                    return this.getFallbackData();
                }
            }
            
            getFallbackData() {
                // Fallback data in case API fails
                return [
                    {
                        id: 1,
                        taxon: {
                            id: 47126,
                            name: 'Quercus',
                            preferred_common_name: 'Oak',
                            iconic_taxon_name: 'Plantae'
                        },
                        photos: [{
                            url: 'https://inaturalist-open-data.s3.amazonaws.com/photos/1/medium.jpg'
                        }]
                    }
                ];
            }
            
            async loadNextQuestion() {
                this.gameContent.innerHTML = '<div class="loading">Loading next question...</div>';
                
                const observations = await this.fetchSpeciesData();
                const validObservations = observations.filter(obs => 
                    obs.taxon && 
                    obs.taxon.preferred_common_name && 
                    obs.photos && 
                    obs.photos.length > 0 &&
                    !this.usedSpecies.has(obs.taxon.id)
                );
                
                if (validObservations.length < 4) {
                    // Reset used species if we're running out
                    this.usedSpecies.clear();
                }
                
                const correctObservation = validObservations[Math.floor(Math.random() * validObservations.length)];
                this.usedSpecies.add(correctObservation.taxon.id);
                
                // Generate wrong answers from the same dataset
                const wrongObservations = validObservations
                    .filter(obs => obs.taxon.id !== correctObservation.taxon.id)
                    .slice(0, 3);
                
                this.currentQuestion = {
                    correct: correctObservation,
                    options: this.shuffleArray([correctObservation, ...wrongObservations])
                };
                
                this.renderQuestion();
            }
            
            renderQuestion() {
                const { correct, options } = this.currentQuestion;
                const photo = correct.photos[0];
                const imageUrl = photo.url.replace('square', 'medium');
                
                this.gameContent.innerHTML = `
                    <div class="image-container">
                        <img src="${imageUrl}" alt="Species to identify" class="species-image" />
                    </div>
                    <div class="question">What species is this?</div>
                    <div class="options">
                        ${options.map((option, index) => `
                            <div class="option" data-index="${index}" onclick="game.selectAnswer(${index})">
                                ${option.taxon.preferred_common_name}
                                ${option.taxon.name !== option.taxon.preferred_common_name ? 
                                  `<br><small><em>${option.taxon.name}</em></small>` : ''}
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="controls">
                        <button class="btn" onclick="game.loadNextQuestion()" id="nextBtn" style="display:none;">
                            Next Question
                        </button>
                    </div>
                `;
            }
            
            selectAnswer(selectedIndex) {
                const options = document.querySelectorAll('.option');
                const correctIndex = this.currentQuestion.options.findIndex(
                    option => option.taxon.id === this.currentQuestion.correct.taxon.id
                );
                
                options.forEach(option => option.classList.add('disabled'));
                
                if (selectedIndex === correctIndex) {
                    options[selectedIndex].classList.add('correct');
                    this.score += 10;
                    this.streak += 1;
                    document.getElementById('feedback').textContent = '✅ Correct! Well done!';
                    document.getElementById('feedback').style.color = '#4CAF50';
                } else {
                    options[selectedIndex].classList.add('incorrect');
                    options[correctIndex].classList.add('correct');
                    this.streak = 0;
                    document.getElementById('feedback').innerHTML = 
                        `❌ Not quite! The correct answer is <strong>${this.currentQuestion.correct.taxon.preferred_common_name}</strong>`;
                    document.getElementById('feedback').style.color = '#f44336';
                }
                
                this.total += 1;
                this.updateScore();
                document.getElementById('nextBtn').style.display = 'block';
            }
            
            updateScore() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('streak').textContent = this.streak;
                document.getElementById('total').textContent = this.total;
                
                const accuracy = this.total > 0 ? (this.score / (this.total * 10)) * 100 : 0;
                document.getElementById('progressFill').style.width = `${accuracy}%`;
            }
            
            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }
        }
        
        // Initialize the game
        const game = new NatureGame();
    </script>
</body>

                            id: 47126,
                            name: 'Quercus',
                            preferred_common_name: 'Oak',
                            iconic_taxon_name: 'Plantae'
                        },
                        photos: [{
                            url: 'https://inaturalist-open-data.s3.amazonaws.com/photos/1/medium.jpg'
                        }]
                    }
                ];
            }
            
            async loadNextQuestion() {
                this.gameContent.innerHTML = '<div class="loading">Loading next question...</div>';
                
                const observations = await this.fetchSpeciesData();
                const validObservations = observations.filter(obs => 
                    obs.taxon && 
                    obs.taxon.preferred_common_name && 
                    obs.photos && 
                    obs.photos.length > 0 &&
                    !this.usedSpecies.has(obs.taxon.id)
                );
                
                if (validObservations.length < 4) {
                    // Reset used species if we're running out
                    this.usedSpecies.clear();
                }
                
                const correctObservation = validObservations[Math.floor(Math.random() * validObservations.length)];
                this.usedSpecies.add(correctObservation.taxon.id);
                
                // Generate wrong answers from the same dataset
                const wrongObservations = validObservations
                    .filter(obs => obs.taxon.id !== correctObservation.taxon.id)
                    .slice(0, 3);
                
                this.currentQuestion = {
                    correct: correctObservation,
                    options: this.shuffleArray([correctObservation, ...wrongObservations])
                };
                
                this.renderQuestion();
            }
            
            renderQuestion() {
                const { correct, options } = this.currentQuestion;
                const photo = correct.photos[0];
                const imageUrl = photo.url.replace('square', 'medium');
                
                this.gameContent.innerHTML = `
                    <div class="image-container">
                        <img src="${imageUrl}" alt="Species to identify" class="species-image" />
                    </div>
                    <div class="question">What species is this?</div>
                    <div class="options">
                        ${options.map((option, index) => `
                            <div class="option" data-index="${index}" onclick="game.selectAnswer(${index})">
                                ${option.taxon.preferred_common_name}
                                ${option.taxon.name !== option.taxon.preferred_common_name ? 
                                  `<br><small><em>${option.taxon.name}</em></small>` : ''}
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="controls">
                        <button class="btn" onclick="game.loadNextQuestion()" id="nextBtn" style="display:none;">
                            Next Question
                        </button>
                    </div>
                `;
            }
            
            selectAnswer(selectedIndex) {
                const options = document.querySelectorAll('.option');
                const correctIndex = this.currentQuestion.options.findIndex(
                    option => option.taxon.id === this.currentQuestion.correct.taxon.id
                );
                
                options.forEach(option => option.classList.add('disabled'));
                
                if (selectedIndex === correctIndex) {
                    options[selectedIndex].classList.add('correct');
                    this.score += 10;
                    this.streak += 1;
                    document.getElementById('feedback').textContent = '✅ Correct! Well done!';
                    document.getElementById('feedback').style.color = '#4CAF50';
                } else {
                    options[selectedIndex].classList.add('incorrect');
                    options[correctIndex].classList.add('correct');
                    this.streak = 0;
                    document.getElementById('feedback').innerHTML = 
                        `❌ Not quite! The correct answer is <strong>${this.currentQuestion.correct.taxon.preferred_common_name}</strong>`;
                    document.getElementById('feedback').style.color = '#f44336';
                }
                
                this.total += 1;
                this.updateScore();
                document.getElementById('nextBtn').style.display = 'block';
            }
            
            updateScore() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('streak').textContent = this.streak;
                document.getElementById('total').textContent = this.total;
                
                const accuracy = this.total > 0 ? (this.score / (this.total * 10)) * 100 : 0;
                document.getElementById('progressFill').style.width = `${accuracy}%`;
            }
            
            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }
        }
        
        // Initialize the game
        const game = new NatureGame();
    </script>
</body>
</html>
