<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature ID Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 100%;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #e0e6ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 300px;
            margin: 20px 0;
        }
        
        .score-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .game-area {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .loading {
            text-align: center;
            font-size: 1.2em;
            padding: 40px;
        }
        
        .image-container {
            width: 100%;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .species-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .species-image:hover {
            transform: scale(1.05);
        }
        
        .question {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        .options {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .option {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1.1em;
            backdrop-filter: blur(10px);
        }
        
        .option:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .option.correct {
            background: rgba(76, 175, 80, 0.8);
            border-color: #4CAF50;
            animation: correctPulse 0.6s ease;
        }
        
        .option.incorrect {
            background: rgba(244, 67, 54, 0.8);
            border-color: #f44336;
            animation: shake 0.6s ease;
        }
        
        .option.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        
        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn.secondary {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .feedback {
            text-align: center;
            margin: 20px 0;
            font-size: 1.1em;
            min-height: 25px;
            font-weight: 500;
        }
        
        .species-info {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .species-info-header {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            color: #fff;
        }
        
        .species-info-header em {
            font-size: 0.9em;
            opacity: 0.8;
            font-weight: 400;
        }
        
        .taxonomy {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .species-facts {
            display: grid;
            gap: 8px;
        }
        
        .fact {
            font-size: 0.95em;
            line-height: 1.4;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            border-left: 3px solid rgba(255, 255, 255, 0.3);
        }
        
        .settings {
            margin: 20px 0;
            text-align: center;
        }
        
        .settings select {
            padding: 8px 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            margin: 5px 5px;
            font-size: 1em;
            min-width: 140px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .game-area {
                padding: 20px;
            }
            
            .image-container {
                height: 250px;
            }
            
            .question {
                font-size: 1.1em;
            }
            
            .option {
                padding: 12px 15px;
                font-size: 1em;
            }
            
            .settings select {
                min-width: 120px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌿 Nature ID Game 🦋</h1>
            <div class="score-board">
                <div class="score-item">
                    <div>Score</div>
                    <div id="score">0</div>
                </div>
                <div class="score-item">
                    <div>Streak</div>
                    <div id="streak">0</div>
                </div>
                <div class="score-item">
                    <div>Total</div>
                    <div id="total">0</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="game-area">
            <div class="settings">
                <select id="categorySelect">
                    <option value="all">All Species</option>
                    <option value="birds">🐦 Birds</option>
                    <option value="plants">🌱 Plants</option>
                    <option value="insects">🦋 Insects</option>
                    <option value="mammals">🐾 Mammals</option>
                    <option value="fish">🐠 Fish</option>
                    <option value="reptiles">🦎 Reptiles</option>
                    <option value="amphibians">🐸 Amphibians</option>
                    <option value="arachnids">🕷️ Spiders</option>
                    <option value="mollusks">🐌 Mollusks</option>
                    <option value="fungi">🍄 Fungi</option>
                </select>
                <select id="difficultySelect">
                    <option value="easy">Easy (Common)</option>
                    <option value="medium">Medium (Mixed)</option>
                    <option value="hard">Hard (Rare)</option>
                </select>
                <br><br>
                <select id="regionSelect">
                    <option value="global">Global Species</option>
                    <optgroup label="US Regions">
                        <option value="northeast">Northeast US</option>
                        <option value="southeast">Southeast US</option>
                        <option value="midwest">Midwest US</option>
                        <option value="southwest">Southwest US</option>
                        <option value="west">Western US</option>
                        <option value="pacific">Pacific Northwest</option>
                    </optgroup>
                    <optgroup label="US States">
                        <option value="california">California</option>
                        <option value="texas">Texas</option>
                        <option value="florida">Florida</option>
                        <option value="new-york">New York</option>
                        <option value="pennsylvania">Pennsylvania</option>
                        <option value="illinois">Illinois</option>
                        <option value="ohio">Ohio</option>
                        <option value="michigan">Michigan</option>
                        <option value="georgia">Georgia</option>
                        <option value="north-carolina">North Carolina</option>
                        <option value="virginia">Virginia</option>
                        <option value="washington">Washington</option>
                        <option value="arizona">Arizona</option>
                        <option value="massachusetts">Massachusetts</option>
                        <option value="colorado">Colorado</option>
                    </optgroup>
                    <optgroup label="Other Regions">
                        <option value="canada">Canada</option>
                        <option value="uk">United Kingdom</option>
                        <option value="australia">Australia</option>
                        <option value="europe">Europe</option>
                    </optgroup>
                </select>
            </div>
            
            <div id="gameContent">
                <div class="loading">Loading nature data...</div>
            </div>
        </div>
    </div>

    <script>
        class NatureGame {
            constructor() {
                this.score = 0;
                this.streak = 0;
                this.total = 0;
                this.currentQuestion = null;
                this.gameContent = document.getElementById('gameContent');
                this.categorySelect = document.getElementById('categorySelect');
                this.difficultySelect = document.getElementById('difficultySelect');
                this.regionSelect = document.getElementById('regionSelect');
                this.questionQueue = [];
                this.isPreloading = false;
                this.usedSpecies = new Set();
                
                this.init();
            }
            
            async init() {
                this.bindEvents();
                await this.preloadQuestions();
                this.loadNextQuestion();
            }
            
            bindEvents() {
                this.categorySelect.addEventListener('change', () => {
                    this.usedSpecies.clear();
                    this.questionQueue = [];
                    this.gameContent.innerHTML = '<div class="loading">Loading new species...</div>';
                    this.preloadQuestions().then(() => this.loadNextQuestion());
                });
                
                this.difficultySelect.addEventListener('change', () => {
                    this.usedSpecies.clear();
                    this.questionQueue = [];
                    this.gameContent.innerHTML = '<div class="loading">Loading new questions...</div>';
                    this.preloadQuestions().then(() => this.loadNextQuestion());
                });
                
                this.regionSelect.addEventListener('change', () => {
                    this.usedSpecies.clear();
                    this.questionQueue = [];
                    this.gameContent.innerHTML = '<div class="loading">Loading regional species...</div>';
                    this.preloadQuestions().then(() => this.loadNextQuestion());
                });
            }
            
            getRegionBounds(region) {
                const regions = {
                    'global': null,
                    // US Regions
                    'northeast': { swlat: 39.7, swlng: -80.5, nelat: 47.5, nelng: -66.9 },
                    'southeast': { swlat: 24.4, swlng: -88.5, nelat: 39.7, nelng: -75.4 },
                    'midwest': { swlat: 36.9, swlng: -104.0, nelat: 49.4, nelng: -80.5 },
                    'southwest': { swlat: 25.8, swlng: -125.0, nelat: 42.0, nelng: -93.5 },
                    'west': { swlat: 32.5, swlng: -125.0, nelat: 49.0, nelng: -104.0 },
                    'pacific': { swlat: 42.0, swlng: -125.0, nelat: 49.0, nelng: -116.9 },
                    // US States
                    'california': { swlat: 32.5, swlng: -124.5, nelat: 42.0, nelng: -114.1 },
                    'texas': { swlat: 25.8, swlng: -106.6, nelat: 36.5, nelng: -93.5 },
                    'florida': { swlat: 24.4, swlng: -87.6, nelat: 31.0, nelng: -79.8 },
                    'new-york': { swlat: 40.4, swlng: -79.8, nelat: 45.0, nelng: -71.8 },
                    'pennsylvania': { swlat: 39.7, swlng: -80.5, nelat: 42.5, nelng: -74.7 },
                    'illinois': { swlat: 36.9, swlng: -91.5, nelat: 42.5, nelng: -87.0 },
                    'ohio': { swlat: 38.4, swlng: -84.8, nelat: 42.3, nelng: -80.5 },
                    'michigan': { swlat: 41.6, swlng: -90.4, nelat: 48.3, nelng: -82.1 },
                    'georgia': { swlat: 30.3, swlng: -85.6, nelat: 35.0, nelng: -80.8 },
                    'north-carolina': { swlat: 33.8, swlng: -84.3, nelat: 36.6, nelng: -75.4 },
                    'virginia': { swlat: 36.5, swlng: -83.7, nelat: 39.5, nelng: -75.2 },
                    'washington': { swlat: 45.5, swlng: -124.8, nelat: 49.0, nelng: -116.9 },
                    'arizona': { swlat: 31.3, swlng: -114.8, nelat: 37.0, nelng: -109.0 },
                    'massachusetts': { swlat: 41.2, swlng: -73.5, nelat: 42.9, nelng: -69.9 },
                    'colorado': { swlat: 36.9, swlng: -109.1, nelat: 41.0, nelng: -102.0 },
                    // Other regions
                    'canada': { swlat: 41.6, swlng: -141.0, nelat: 83.1, nelng: -52.6 },
                    'uk': { swlat: 49.9, swlng: -10.7, nelat: 60.8, nelng: 1.8 },
                    'australia': { swlat: -43.6, swlng: 113.3, nelat: -10.7, nelng: 153.6 },
                    'europe': { swlat: 35.8, swlng: -10.7, nelat: 71.2, nelng: 40.2 }
                };
                
                return regions[region] || null;
            }
            
            getCategoryTaxonIds(category) {
                // Using iNaturalist's taxon IDs for specific groups
                const categories = {
                    'all': null,
                    'birds': [3], // Aves
                    'plants': [47126], // Plantae
                    'insects': [47158], // Insecta
                    'mammals': [40151], // Mammalia
                    'fish': [47178], // Actinopterygii (ray-finned fish)
                    'reptiles': [26036], // Reptilia
                    'amphibians': [20978], // Amphibia
                    'arachnids': [47119], // Arachnida
                    'mollusks': [47115], // Mollusca
                    'fungi': [47170] // Fungi
                };
                
                return categories[category];
            }
            
            async preloadQuestions() {
                if (this.isPreloading) return;
                this.isPreloading = true;
                
                try {
                    // Preload 5 questions
                    while (this.questionQueue.length < 5) {
                        const observations = await this.fetchSpeciesData();
                        if (observations && observations.length > 0) {
                            const questions = await this.processObservationsIntoQuestions(observations);
                            this.questionQueue.push(...questions);
                        } else {
                            // If no data, break to avoid infinite loop
                            break;
                        }
                    }
                    console.log(`Preloaded ${this.questionQueue.length} questions`);
                } catch (error) {
                    console.error('Error preloading questions:', error);
                } finally {
                    this.isPreloading = false;
                }
            }
            
            async processObservationsIntoQuestions(observations) {
                const validObservations = observations.filter(obs => 
                    obs.taxon && 
                    obs.taxon.preferred_common_name && 
                    obs.photos && 
                    obs.photos.length > 0 &&
                    !this.usedSpecies.has(obs.taxon.id)
                );
                
                if (validObservations.length < 8) {
                    // Reset used species if we're running out
                    this.usedSpecies.clear();
                }
                
                const questions = [];
                const used = new Set();
                
                // Create multiple questions from this batch
                const maxQuestions = Math.min(3, Math.floor(validObservations.length / 4));
                for (let i = 0; i < maxQuestions; i++) {
                    const availableObs = validObservations.filter(obs => 
                        !used.has(obs.taxon.id) && !this.usedSpecies.has(obs.taxon.id)
                    );
                    
                    if (availableObs.length < 4) break;
                    
                    const correctObservation = availableObs[Math.floor(Math.random() * availableObs.length)];
                    used.add(correctObservation.taxon.id);
                    this.usedSpecies.add(correctObservation.taxon.id);
                    
                    // Generate wrong answers
                    const wrongObservations = availableObs
                        .filter(obs => obs.taxon.id !== correctObservation.taxon.id)
                        .sort(() => Math.random() - 0.5)
                        .slice(0, 3);
                    
                    wrongObservations.forEach(obs => used.add(obs.taxon.id));
                    
                    questions.push({
                        correct: correctObservation,
                        options: this.shuffleArray([correctObservation, ...wrongObservations])
                    });
                }
                
                return questions;
            }
            
            async fetchSpeciesData() {
                const category = this.categorySelect.value;
                const difficulty = this.difficultySelect.value;
                const region = this.regionSelect.value;
                
                console.log('Fetching data for category:', category, 'region:', region);
                
                const qualityGrade = difficulty === 'hard' ? 'research' : 'needs_id,research';
                const popular = difficulty === 'easy' ? 'true' : 'false';
                
                // Get category-specific taxon IDs
                const taxonIds = this.getCategoryTaxonIds(category);
                
                // Get regional bounds
                const bounds = this.getRegionBounds(region);
                console.log('Region bounds:', bounds);
                
                try {
                    const randomPage = Math.floor(Math.random() * 50) + 1;
                    
                    // Build taxon parameter
                    let taxonParam = '';
                    if (taxonIds && taxonIds.length > 0) {
                        taxonParam = taxonIds.map(id => `taxon_id=${id}`).join('&') + '&';
                    }
                    
                    let boundsParam = '';
                    if (bounds) {
                        boundsParam = `&swlat=${bounds.swlat}&swlng=${bounds.swlng}&nelat=${bounds.nelat}&nelng=${bounds.nelng}`;
                        console.log('Adding bounds parameter:', boundsParam);
                    }
                    
                    const apiUrl = `https://api.inaturalist.org/v1/observations?` +
                        `${taxonParam}` +
                        `quality_grade=${qualityGrade}&` +
                        `popular=${popular}&` +
                        `photos=true&` +
                        `per_page=30&` +
                        `page=${randomPage}&` +
                        `order=random` +
                        boundsParam;
                    
                    console.log('Final API URL:', apiUrl);
                    
                    const response = await fetch(apiUrl);
                    
                    if (!response.ok) throw new Error('API request failed');
                    
                    const data = await response.json();
                    console.log('Received', data.results.length, 'observations for category:', category, 'region:', region);
                    return data.results;
                } catch (error) {
                    console.error('Error fetching data:', error);
                    return this.getFallbackData();
                }
            }
            
            getFallbackData() {
                // Fallback data in case API fails
                return [
                    {
                        id: 1,
                        taxon: {
                            id: 47126,
                            name: 'Quercus',
                            preferred_common_name: 'Oak',
                            iconic_taxon_name: 'Plantae'
                        },
                        photos: [{
                            url: 'https://inaturalist-open-data.s3.amazonaws.com/photos/1/medium.jpg'
                        }]
                    }
                ];
            }
            
            async loadNextQuestion() {
                // Check if we need to preload more questions
                if (this.questionQueue.length < 2 && !this.isPreloading) {
                    this.preloadQuestions();
                }
                
                // If we have a question ready, use it
                if (this.questionQueue.length > 0) {
                    this.currentQuestion = this.questionQueue.shift();
                    this.renderQuestion();
                    return;
                }
                
                // Fallback: load question directly if queue is empty
                this.gameContent.innerHTML = '<div class="loading">Loading next question...</div>';
                
                const observations = await this.fetchSpeciesData();
                const questions = await this.processObservationsIntoQuestions(observations);
                
                if (questions.length > 0) {
                    this.currentQuestion = questions[0];
                    this.questionQueue.push(...questions.slice(1));
                    this.renderQuestion();
                } else {
                    this.gameContent.innerHTML = '<div class="loading">No species found for this selection. Try different filters.</div>';
                }
            }
            
            renderQuestion() {
                const { correct, options } = this.currentQuestion;
                const photo = correct.photos[0];
                const imageUrl = photo.url.replace('square', 'medium');
                
                this.gameContent.innerHTML = `
                    <div class="image-container">
                        <img src="${imageUrl}" alt="Species to identify" class="species-image" />
                    </div>
                    <div class="question">What species is this?</div>
                    <div class="options">
                        ${options.map((option, index) => `
                            <div class="option" data-index="${index}" onclick="game.selectAnswer(${index})">
                                ${option.taxon.preferred_common_name}
                                ${option.taxon.name !== option.taxon.preferred_common_name ? 
                                  `<br><small><em>${option.taxon.name}</em></small>` : ''}
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="species-info" id="speciesInfo" style="display:none;"></div>
                    <div class="controls">
                        <button class="btn" onclick="game.loadNextQuestion()" id="nextBtn" style="display:none;">
                            Next Question
                        </button>
                    </div>
                `;
            }
            
            selectAnswer(selectedIndex) {
                const options = document.querySelectorAll('.option');
                const correctIndex = this.currentQuestion.options.findIndex(
                    option => option.taxon.id === this.currentQuestion.correct.taxon.id
                );
                
                options.forEach(option => option.classList.add('disabled'));
                
                if (selectedIndex === correctIndex) {
                    options[selectedIndex].classList.add('correct');
                    this.score += 10;
                    this.streak += 1;
                    document.getElementById('feedback').textContent = '✅ Correct! Well done!';
                    document.getElementById('feedback').style.color = '#4CAF50';
                } else {
                    options[selectedIndex].classList.add('incorrect');
                    options[correctIndex].classList.add('correct');
                    this.streak = 0;
                    document.getElementById('feedback').innerHTML = 
                        `❌ Not quite! The correct answer is <strong>${this.currentQuestion.correct.taxon.preferred_common_name}</strong>`;
                    document.getElementById('feedback').style.color = '#f44336';
                }
                
                this.total += 1;
                this.updateScore();
                this.showSpeciesInfo();
                document.getElementById('nextBtn').style.display = 'block';
            }
            
            showSpeciesInfo() {
                const species = this.currentQuestion.correct;
                const infoDiv = document.getElementById('speciesInfo');
                
                if (infoDiv) {
                    // Build species information
                    let infoHTML = `
                        <div class="species-info-header">
                            <strong>${species.taxon.preferred_common_name}</strong>
                            ${species.taxon.name !== species.taxon.preferred_common_name ? 
                                `<br><em>${species.taxon.name}</em>` : ''}
                        </div>
                    `;
                    
                    // Add taxonomic information
                    if (species.taxon.rank) {
                        infoHTML += `<div class="taxonomy">Rank: ${species.taxon.rank}</div>`;
                    }
                    
                    // Add basic info from the observation
                    let facts = [];
                    
                    // Location info
                    if (species.place_guess) {
                        facts.push(`📍 Observed in: ${species.place_guess}`);
                    }
                    
                    // Date info
                    if (species.observed_on_details && species.observed_on_details.date) {
                        const date = new Date(species.observed_on_details.date);
                        const month = date.toLocaleString('default', { month: 'long' });
                        facts.push(`📅 Often observed in: ${month}`);
                    }
                    
                    // Conservation status
                    if (species.taxon.conservation_status) {
                        const status = species.taxon.conservation_status;
                        const statusEmoji = this.getConservationEmoji(status.status);
                        facts.push(`${statusEmoji} Conservation: ${status.status_name || status.status}`);
                    }
                    
                    // Basic taxonomy facts
                    if (species.taxon.iconic_taxon_name === 'Plantae') {
                        facts.push(`🌱 This is a plant species`);
                    } else if (species.taxon.iconic_taxon_name === 'Animalia') {
                        facts.push(`🐾 This is an animal species`);
                    }
                    
                    // Quality grade info
                    if (species.quality_grade === 'research') {
                        facts.push(`✅ This is a research-grade observation, verified by experts`);
                    }
                    
                    // Add number of photos
                    if (species.photos && species.photos.length > 1) {
                        facts.push(`📸 This observation includes ${species.photos.length} photos`);
                    }
                    
                    // Generate interesting facts based on common names
                    const commonFacts = this.getCommonNameFacts(species.taxon.preferred_common_name);
                    facts.push(...commonFacts);
                    
                    // Limit to 4 most interesting facts
                    facts = facts.slice(0, 4);
                    
                    if (facts.length > 0) {
                        infoHTML += `<div class="species-facts">${facts.map(fact => 
                            `<div class="fact">${fact}</div>`
                        ).join('')}</div>`;
                    }
                    
                    infoDiv.innerHTML = infoHTML;
                    infoDiv.style.display = 'block';
                }
            }
            
            getConservationEmoji(status) {
                const statusMap = {
                    'LC': '✅', 'NT': '⚠️', 'VU': '🟡', 'EN': '🟠', 
                    'CR': '🔴', 'EW': '💀', 'EX': '💀'
                };
                return statusMap[status] || '📊';
            }
            
            getCommonNameFacts(commonName) {
                const name = commonName.toLowerCase();
                const facts = [];
                
                // Bird facts
                if (name.includes('cardinal')) facts.push('🐦 Cardinals mate for life and the male feeds the female during courtship');
                if (name.includes('robin')) facts.push('🐦 Robins can live up to 13 years and are often the first to sing at dawn');
                if (name.includes('hawk')) facts.push('🦅 Hawks have incredible eyesight, up to 8 times sharper than humans');
                if (name.includes('owl')) facts.push('🦉 Owls can rotate their heads 270 degrees and fly silently');
                if (name.includes('hummingbird')) facts.push('🐦 Hummingbirds beat their wings 50-80 times per second');
                if (name.includes('eagle')) facts.push('🦅 Eagles can spot prey from over 2 miles away');
                if (name.includes('woodpecker')) facts.push('🐦 Woodpeckers have shock-absorbing skulls and sticky tongues');
                if (name.includes('crow') || name.includes('raven')) facts.push('🐦 Crows and ravens are among the most intelligent birds, using tools');
                
                // Mammal facts
                if (name.includes('deer')) facts.push('🦌 Deer can jump up to 10 feet high and run 30 mph');
                if (name.includes('squirrel')) facts.push('🐿️ Squirrels can find buried nuts months later using their incredible memory');
                if (name.includes('rabbit')) facts.push('🐰 Rabbits can see nearly 360 degrees and sleep with their eyes open');
                if (name.includes('fox')) facts.push('🦊 Foxes use Earth\'s magnetic field to hunt and can hear prey under snow');
                if (name.includes('bear')) facts.push('🐻 Bears have an excellent sense of smell, 7 times better than a bloodhound');
                if (name.includes('wolf')) facts.push('🐺 Wolves can travel up to 50 miles in a day and have 42 teeth');
                if (name.includes('bat')) facts.push('🦇 Bats are the only mammals capable of true flight');
                
                // Tree facts
                if (name.includes('oak')) facts.push('🌳 A single oak tree can support over 500 species of insects and animals');
                if (name.includes('maple')) facts.push('🍁 Maple syrup requires 40 gallons of sap to make 1 gallon of syrup');
                if (name.includes('pine')) facts.push('🌲 Pine trees can live for over 1,000 years and some grow to 200+ feet tall');
                if (name.includes('willow')) facts.push('🌳 Willow bark contains aspirin-like compounds used for pain relief');
                if (name.includes('redwood') || name.includes('sequoia')) facts.push('🌲 Redwoods are the tallest trees on Earth, reaching over 350 feet');
                if (name.includes('cherry')) facts.push('🌸 Cherry blossoms only bloom for about 2 weeks each year');
                
                // Flower facts
                if (name.includes('sunflower')) facts.push('🌻 Sunflowers track the sun across the sky when young, called heliotropism');
                if (name.includes('rose')) facts.push('🌹 Roses have been cultivated for over 5,000 years and are related to apples');
                if (name.includes('daisy')) facts.push('🌼 Daisies are actually composite flowers made of many tiny flowers');
                if (name.includes('tulip')) facts.push('🌷 Tulips were once so valuable in Holland they caused an economic bubble');
                if (name.includes('orchid')) facts.push('🌺 Orchids are one of the largest plant families with over 25,000 species');
                
                // Insect facts
                if (name.includes('butterfly')) facts.push('🦋 Butterflies taste with their feet and smell with their antennae');
                if (name.includes('monarch')) facts.push('🦋 Monarch butterflies migrate up to 3,000 miles, taking 4 generations');
                if (name.includes('bee')) facts.push('🐝 Bees communicate through dance and a colony can contain up to 80,000 bees');
                if (name.includes('ant')) facts.push('🐜 Ants can lift 10-50 times their own body weight');
                if (name.includes('dragonfly')) facts.push('🜟 Dragonflies can see in nearly 360 degrees and catch 95% of their prey');
                if (name.includes('firefly') || name.includes('lightning bug')) facts.push('✨ Fireflies produce light without heat through bioluminescence');
                
                // Fish facts
                if (name.includes('salmon')) facts.push('🐟 Salmon can swim upstream and jump up waterfalls to spawn');
                if (name.includes('shark')) facts.push('🦈 Sharks have been around for over 400 million years');
                if (name.includes('trout')) facts.push('🐟 Trout can live up to 20 years and are indicators of clean water');
                if (name.includes('bass')) facts.push('🐟 Bass are excellent parents, with males guarding their nests');
                
                // Reptile facts
                if (name.includes('turtle')) facts.push('🐢 Some turtles can live over 100 years and navigate using magnetic fields');
                if (name.includes('snake')) facts.push('🐍 Snakes can unhinge their jaws to swallow prey larger than their head');
                if (name.includes('lizard')) facts.push('🦎 Many lizards can regrow their tails if they lose them to predators');
                if (name.includes('gecko')) facts.push('🦎 Geckos can walk on walls and ceilings using millions of tiny hairs');
                
                // Amphibian facts
                if (name.includes('frog')) facts.push('🐸 Frogs absorb water through their skin and some can freeze solid in winter');
                if (name.includes('toad')) facts.push('🐸 Toads can live up to 40 years and some species give birth through their skin');
                if (name.includes('salamander')) facts.push('🦎 Salamanders can regenerate lost limbs, tails, and even parts of organs');
                
                // Spider facts
                if (name.includes('spider')) facts.push('🕷️ Spider silk is stronger than steel by weight and more elastic than rubber');
                if (name.includes('tarantula')) facts.push('🕷️ Tarantulas can live up to 30 years and regrow lost legs');
                if (name.includes('black widow')) facts.push('🕷️ Only female black widows are dangerous; males are much smaller');
                
                // Fungi facts
                if (name.includes('mushroom')) facts.push('🍄 Mushrooms are more closely related to animals than plants');
                if (name.includes('moss')) facts.push('🌿 Moss can survive in space and doesn\'t have roots, stems, or leaves');
                
                return facts.slice(0, 2); // Return max 2 facts per species
            }
            
            updateScore() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('streak').textContent = this.streak;
                document.getElementById('total').textContent = this.total;
                
                const accuracy = this.total > 0 ? (this.score / (this.total * 10)) * 100 : 0;
                document.getElementById('progressFill').style.width = `${accuracy}%`;
            }
            
            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }
        }
        
        // Initialize the game
        const game = new NatureGame();
    </script>
</body>
</html>
