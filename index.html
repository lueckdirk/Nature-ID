<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature ID Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 100%;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #e0e6ff);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 300px;
            margin: 20px 0;
        }
        
        .score-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 15px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        
        .game-area {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        .loading {
            text-align: center;
            font-size: 1.2em;
            padding: 40px;
        }
        
        .image-container {
            width: 100%;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .species-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .species-image:hover {
            transform: scale(1.05);
        }
        
        .question {
            text-align: center;
            font-size: 1.3em;
            margin-bottom: 25px;
            font-weight: 500;
        }
        
        .options {
            display: grid;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .option {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid transparent;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 1.1em;
            backdrop-filter: blur(10px);
        }
        
        .option:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .option.correct {
            background: rgba(76, 175, 80, 0.8);
            border-color: #4CAF50;
            animation: correctPulse 0.6s ease;
        }
        
        .option.incorrect {
            background: rgba(244, 67, 54, 0.8);
            border-color: #f44336;
            animation: shake 0.6s ease;
        }
        
        .option.disabled {
            pointer-events: none;
            opacity: 0.7;
        }
        
        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn.secondary {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .feedback {
            text-align: center;
            margin: 20px 0;
            font-size: 1.1em;
            min-height: 25px;
            font-weight: 500;
        }
        
        .settings {
            margin: 20px 0;
            text-align: center;
        }
        
        .settings select {
            padding: 8px 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            margin: 5px 5px;
            font-size: 1em;
            min-width: 140px;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin: 15px 0;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        
        .species-info {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .species-info-header {
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
            text-align: center;
            color: #fff;
        }
        
        .species-info-header em {
            font-size: 0.9em;
            opacity: 0.8;
            font-weight: 400;
        }
        
        .taxonomy {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .species-facts {
            display: grid;
            gap: 8px;
        }
        
        .fact {
            font-size: 0.95em;
            line-height: 1.4;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            border-left: 3px solid rgba(255, 255, 255, 0.3);
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .game-area {
                padding: 20px;
            }
            
            .image-container {
                height: 250px;
            }
            
            .question {
                font-size: 1.1em;
            }
            
            .option {
                padding: 12px 15px;
                font-size: 1em;
            }
            
            .settings select {
                min-width: 120px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌿 Nature ID Game 🦋</h1>
            <div class="score-board">
                <div class="score-item">
                    <div>Score</div>
                    <div id="score">0</div>
                </div>
                <div class="score-item">
                    <div>Streak</div>
                    <div id="streak">0</div>
                </div>
                <div class="score-item">
                    <div>Total</div>
                    <div id="total">0</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        
        <div class="game-area">
            <div class="settings">
                <select id="categorySelect">
                    <option value="both">Plants & Animals</option>
                    <option value="plants">Plants Only</option>
                    <option value="animals">Animals Only</option>
                </select>
                <select id="difficultySelect">
                    <option value="easy">Easy (Common)</option>
                    <option value="medium">Medium (Mixed)</option>
                    <option value="hard">Hard (Rare)</option>
                </select>
                <br><br>
                <select id="regionSelect">
                    <option value="global">Global Species</option>
                    <optgroup label="US Regions">
                        <option value="northeast">Northeast US</option>
                        <option value="southeast">Southeast US</option>
                        <option value="midwest">Midwest US</option>
                        <option value="southwest">Southwest US</option>
                        <option value="west">Western US</option>
                        <option value="pacific">Pacific Northwest</option>
                    </optgroup>
                    <optgroup label="US States">
                        <option value="california">California</option>
                        <option value="texas">Texas</option>
                        <option value="florida">Florida</option>
                        <option value="new-york">New York</option>
                        <option value="pennsylvania">Pennsylvania</option>
                        <option value="illinois">Illinois</option>
                        <option value="ohio">Ohio</option>
                        <option value="michigan">Michigan</option>
                        <option value="georgia">Georgia</option>
                        <option value="north-carolina">North Carolina</option>
                        <option value="virginia">Virginia</option>
                        <option value="washington">Washington</option>
                        <option value="arizona">Arizona</option>
                        <option value="massachusetts">Massachusetts</option>
                        <option value="colorado">Colorado</option>
                    </optgroup>
                    <optgroup label="Other Regions">
                        <option value="canada">Canada</option>
                        <option value="uk">United Kingdom</option>
                        <option value="australia">Australia</option>
                        <option value="europe">Europe</option>
                    </optgroup>
                </select>
            </div>
            
            <div id="gameContent">
                <div class="loading">Loading nature data...</div>
            </div>
        </div>
    </div>

    <script>
        class NatureGame {
            constructor() {
                this.score = 0;
                this.streak = 0;
                this.total = 0;
                this.currentQuestion = null;
                this.gameContent = document.getElementById('gameContent');
                this.categorySelect = document.getElementById('categorySelect');
                this.difficultySelect = document.getElementById('difficultySelect');
                this.regionSelect = document.getElementById('regionSelect');
                this.questionQueue = [];
                this.isPreloading = false;
                this.usedSpecies = new Set();
                
                this.init();
            }
            
            async init() {
                this.bindEvents();
                await this.preloadQuestions();
                this.loadNextQuestion();
            }
            
            bindEvents() {
                this.categorySelect.addEventListener('change', () => {
                    this.usedSpecies.clear();
                    this.questionQueue = [];
                    this.gameContent.innerHTML = '<div class="loading">Loading new questions...</div>';
                    this.preloadQuestions().then(() => this.loadNextQuestion());
                });
                
                this.difficultySelect.addEventListener('change', () => {
                    this.usedSpecies.clear();
                    this.questionQueue = [];
                    this.gameContent.innerHTML = '<div class="loading">Loading new questions...</div>';
                    this.preloadQuestions().then(() => this.loadNextQuestion());
                });
                
                this.regionSelect.addEventListener('change', () => {
                    this.usedSpecies.clear();
                    this.questionQueue = [];
                    this.gameContent.innerHTML = '<div class="loading">Loading regional species...</div>';
                    this.preloadQuestions().then(() => this.loadNextQuestion());
                });
            }
            
            getRegionBounds(region) {
                const regions = {
                    'global': null,
                    // US Regions
                    'northeast': { swlat: 39.7, swlng: -80.5, nelat: 47.5, nelng: -66.9 },
                    'southeast': { swlat: 24.4, swlng: -88.5, nelat: 39.7, nelng: -75.4 },
                    'midwest': { swlat: 36.9, swlng: -104.0, nelat: 49.4, nelng: -80.5 },
                    'southwest': { swlat: 25.8, swlng: -125.0, nelat: 42.0, nelng: -93.5 },
                    'west': { swlat: 32.5, swlng: -125.0, nelat: 49.0, nelng: -104.0 },
                    'pacific': { swlat: 42.0, swlng: -125.0, nelat: 49.0, nelng: -116.9 },
                    // US States
                    'california': { swlat: 32.5, swlng: -124.5, nelat: 42.0, nelng: -114.1 },
                    'texas': { swlat: 25.8, swlng: -106.6, nelat: 36.5, nelng: -93.5 },
                    'florida': { swlat: 24.4, swlng: -87.6, nelat: 31.0, nelng: -79.8 },
                    'new-york': { swlat: 40.4, swlng: -79.8, nelat: 45.0, nelng: -71.8 },
                    'pennsylvania': { swlat: 39.7, swlng: -80.5, nelat: 42.5, nelng: -74.7 },
                    'illinois': { swlat: 36.9, swlng: -91.5, nelat: 42.5, nelng: -87.0 },
                    'ohio': { swlat: 38.4, swlng: -84.8, nelat: 42.3, nelng: -80.5 },
                    'michigan': { swlat: 41.6, swlng: -90.4, nelat: 48.3, nelng: -82.1 },
                    'georgia': { swlat: 30.3, swlng: -85.6, nelat: 35.0, nelng: -80.8 },
                    'north-carolina': { swlat: 33.8, swlng: -84.3, nelat: 36.6, nelng: -75.4 },
                    'virginia': { swlat: 36.5, swlng: -83.7, nelat: 39.5, nelng: -75.2 },
                    'washington': { swlat: 45.5, swlng: -124.8, nelat: 49.0, nelng: -116.9 },
                    'arizona': { swlat: 31.3, swlng: -114.8, nelat: 37.0, nelng: -109.0 },
                    'massachusetts': { swlat: 41.2, swlng: -73.5, nelat: 42.9, nelng: -69.9 },
                    'colorado': { swlat: 36.9, swlng: -109.1, nelat: 41.0, nelng: -102.0 },
                    // Other regions
                    'canada': { swlat: 41.6, swlng: -141.0, nelat: 83.1, nelng: -52.6 },
                    'uk': { swlat: 49.9, swlng: -10.7, nelat: 60.8, nelng: 1.8 },
                    'australia': { swlat: -43.6, swlng: 113.3, nelat: -10.7, nelng: 153.6 },
                    'europe': { swlat: 35.8, swlng: -10.7, nelat: 71.2, nelng: 40.2 }
                };
                
                return regions[region] || null;
            }
            
            async preloadQuestions() {
                if (this.isPreloading) return;
                this.isPreloading = true;
                
                try {
                    // Preload 5 questions
                    while (this.questionQueue.length < 5) {
                        const observations = await this.fetchSpeciesData();
                        if (observations && observations.length > 0) {
                            const questions = await this.processObservationsIntoQuestions(observations);
                            this.questionQueue.push(...questions);
                        } else {
                            // If no data, break to avoid infinite loop
                            break;
                        }
                    }
                    console.log(`Preloaded ${this.questionQueue.length} questions`);
                } catch (error) {
                    console.error('Error preloading questions:', error);
                } finally {
                    this.isPreloading = false;
                }
            }
            
            async processObservationsIntoQuestions(observations) {
                const validObservations = observations.filter(obs => 
                    obs.taxon && 
                    obs.taxon.preferred_common_name && 
                    obs.photos && 
                    obs.photos.length > 0 &&
                    !this.usedSpecies.has(obs.taxon.id)
                );
                
                if (validObservations.length < 8) {
                    // Reset used species if we're running out
                    this.usedSpecies.clear();
                }
                
                const questions = [];
                const used = new Set();
                
                // Create multiple questions from this batch
                const maxQuestions = Math.min(3, Math.floor(validObservations.length / 4));
                for (let i = 0; i < maxQuestions; i++) {
                    const availableObs = validObservations.filter(obs => 
                        !used.has(obs.taxon.id) && !this.usedSpecies.has(obs.taxon.id)
                    );
                    
                    if (availableObs.length < 4) break;
                    
                    const correctObservation = availableObs[Math.floor(Math.random() * availableObs.length)];
                    used.add(correctObservation.taxon.id);
                    this.usedSpecies.add(correctObservation.taxon.id);
                    
                    // Generate wrong answers
                    const wrongObservations = availableObs
                        .filter(obs => obs.taxon.id !== correctObservation.taxon.id)
                        .sort(() => Math.random() - 0.5)
                        .slice(0, 3);
                    
                    wrongObservations.forEach(obs => used.add(obs.taxon.id));
                    
                    questions.push({
                        correct: correctObservation,
                        options: this.shuffleArray([correctObservation, ...wrongObservations])
                    });
                }
                
                return questions;
            }
            
            async fetchSpeciesData() {
                const category = this.categorySelect.value;
                const difficulty = this.difficultySelect.value;
                const region = this.regionSelect.value;
                
                console.log('Fetching data for region:', region);
                
                // Define search parameters based on selections
                let iconicTaxa = [];
                if (category === 'plants') iconicTaxa = ['Plantae'];
                else if (category === 'animals') iconicTaxa = ['Animalia'];
                else iconicTaxa = ['Plantae', 'Animalia'];
                
                const qualityGrade = difficulty === 'hard' ? 'research' : 'needs_id,research';
                const popular = difficulty === 'easy' ? 'true' : 'false';
                
                // Get regional bounds
                const bounds = this.getRegionBounds(region);
                console.log('Region bounds:', bounds);
                
                try {
                    const randomPage = Math.floor(Math.random() * 50) + 1;
                    const iconicTaxonParam = iconicTaxa.map(t => `iconic_taxa[]=${t}`).join('&');
                    
                    let boundsParam = '';
                    if (bounds) {
                        boundsParam = `&swlat=${bounds.swlat}&swlng=${bounds.swlng}&nelat=${bounds.nelat}&nelng=${bounds.nelng}`;
                        console.log('Adding bounds parameter:', boundsParam);
                    }
                    
                    const apiUrl = `https://api.inaturalist.org/v1/observations?` +
                        `${iconicTaxonParam}&` +
                        `quality_grade=${qualityGrade}&` +
                        `popular=${popular}&` +
                        `photos=true&` +
                        `per_page=30&` +
                        `page=${randomPage}&` +
                        `order=random` +
                        boundsParam;
                    
                    console.log('Final API URL:', apiUrl);
                    
                    const response = await fetch(apiUrl);
                    
                    if (!response.ok) throw new Error('API request failed');
                    
                    const data = await response.json();
                    console.log('Received', data.results.length, 'observations for region:', region);
                    return data.results;
                } catch (error) {
                    console.error('Error fetching data:', error);
                    return this.getFallbackData();
                }
            }
            
            getFallbackData() {
                // Fallback data in case API fails
                return [
                    {
                        id: 1,
                        taxon: {
                            id: 47126,
                            name: 'Quercus',
                            preferred_common_name: 'Oak',
                            iconic_taxon_name: 'Plantae'
                        },
                        photos: [{
                            url: 'https://inaturalist-open-data.s3.amazonaws.com/photos/1/medium.jpg'
                        }]
                    }
                ];
            }
            
            async loadNextQuestion() {
                // Check if we need to preload more questions
                if (this.questionQueue.length < 2 && !this.isPreloading) {
                    this.preloadQuestions();
                }
                
                // If we have a question ready, use it
                if (this.questionQueue.length > 0) {
                    this.currentQuestion = this.questionQueue.shift();
                    this.renderQuestion();
                    return;
                }
                
                // Fallback: load question directly if queue is empty
                this.gameContent.innerHTML = '<div class="loading">Loading next question...</div>';
                
                const observations = await this.fetchSpeciesData();
                const questions = await this.processObservationsIntoQuestions(observations);
                
                if (questions.length > 0) {
                    this.currentQuestion = questions[0];
                    this.questionQueue.push(...questions.slice(1));
                    this.renderQuestion();
                } else {
                    this.gameContent.innerHTML = '<div class="loading">No species found for this region. Try a different area.</div>';
                }
            }
            
            renderQuestion() {
                const { correct, options } = this.currentQuestion;
                const photo = correct.photos[0];
                const imageUrl = photo.url.replace('square', 'medium');
                
                this.gameContent.innerHTML = `
                    <div class="image-container">
                        <img src="${imageUrl}" alt="Species to identify" class="species-image" />
                    </div>
                    <div class="question">What species is this?</div>
                    <div class="options">
                        ${options.map((option, index) => `
                            <div class="option" data-index="${index}" onclick="game.selectAnswer(${index})">
                                ${option.taxon.preferred_common_name}
                                ${option.taxon.name !== option.taxon.preferred_common_name ? 
                                  `<br><small><em>${option.taxon.name}</em></small>` : ''}
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="feedback"></div>
                    <div class="controls">
                        <button class="btn" onclick="game.loadNextQuestion()" id="nextBtn" style="display:none;">
                            Next Question
                        </button>
                    </div>
                `;
            }
            
            selectAnswer(selectedIndex) {
                const options = document.querySelectorAll('.option');
                const correctIndex = this.currentQuestion.options.findIndex(
                    option => option.taxon.id === this.currentQuestion.correct.taxon.id
                );
                
                options.forEach(option => option.classList.add('disabled'));
                
                if (selectedIndex === correctIndex) {
                    options[selectedIndex].classList.add('correct');
                    this.score += 10;
                    this.streak += 1;
                    document.getElementById('feedback').textContent = '✅ Correct! Well done!';
                    document.getElementById('feedback').style.color = '#4CAF50';
                } else {
                    options[selectedIndex].classList.add('incorrect');
                    options[correctIndex].classList.add('correct');
                    this.streak = 0;
                    document.getElementById('feedback').innerHTML = 
                        `❌ Not quite! The correct answer is <strong>${this.currentQuestion.correct.taxon.preferred_common_name}</strong>`;
                    document.getElementById('feedback').style.color = '#f44336';
                }
                
                this.total += 1;
                this.updateScore();
                document.getElementById('nextBtn').style.display = 'block';
            }
            
            updateScore() {
                document.getElementById('score').textContent = this.score;
                document.getElementById('streak').textContent = this.streak;
                document.getElementById('total').textContent = this.total;
                
                const accuracy = this.total > 0 ? (this.score / (this.total * 10)) * 100 : 0;
                document.getElementById('progressFill').style.width = `${accuracy}%`;
            }
            
            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }
        }
        
        // Initialize the game
        const game = new NatureGame();
    </script>
</body>
</html>
