<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nature ID - Species Study Tool</title>
<style>
:root {
  --bg: #f4f1ec;
  --bg-card: #ffffff;
  --text: #263238;
  --text-mid: #546e7a;
  --text-light: #90a4ae;
  --primary: #2e7d32;
  --primary-dark: #1b5e20;
  --primary-light: #e8f5e9;
  --accent: #e8a817;
  --accent-light: #fff8e1;
  --success: #43a047;
  --success-light: #e8f5e9;
  --error: #e53935;
  --error-light: #ffebee;
  --border: #e0ddd6;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
  --radius: 14px;
  --radius-sm: 10px;
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { height:100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#app {
  max-width: 520px;
  margin: 0 auto;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Header ── */
.app-header {
  padding: 20px 20px 0;
  display: flex;
  align-items: center;
  gap: 12px;
}
.app-header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--primary-dark);
  flex: 1;
}
.app-header .subtitle {
  font-size: 0.82rem;
  color: var(--text-mid);
  font-weight: 400;
}
.back-btn {
  background: var(--primary-light);
  border: none;
  border-radius: 50%;
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--primary);
  font-size: 1.2rem;
  transition: var(--transition);
}
.back-btn:hover { background: #c8e6c9; }

/* ── Stats Bar ── */
.stats-bar {
  display: flex;
  gap: 8px;
  padding: 16px 20px;
  overflow-x: auto;
}
.stat-chip {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 0.82rem;
  white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.stat-chip .num { font-weight: 700; color: var(--primary); }

/* ── Deck Grid ── */
.section-title {
  padding: 8px 20px 12px;
  font-size: 0.78rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-light);
}
.deck-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 20px 20px;
}
.deck-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 16px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
}
.deck-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.deck-card:active { transform: scale(0.97); }
.deck-card .icon { font-size: 1.8rem; margin-bottom: 8px; display: block; }
.deck-card .name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
.deck-card .desc { font-size: 0.78rem; color: var(--text-mid); margin-bottom: 12px; line-height: 1.4; }
.deck-card .progress-row { display: flex; align-items: center; gap: 8px; }
.deck-card .progress-track {
  flex: 1; height: 6px; background: #e8e5de; border-radius: 3px; overflow: hidden;
}
.deck-card .progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--primary), #66bb6a);
  border-radius: 3px; transition: width 0.5s ease;
}
.deck-card .progress-pct { font-size: 0.75rem; font-weight: 600; color: var(--primary); min-width: 32px; text-align: right; }
.deck-card.create-card {
  border: 2px dashed var(--border);
  background: transparent;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--text-mid);
  min-height: 150px;
}
.deck-card.create-card:hover { border-color: var(--primary); color: var(--primary); }
.deck-card.create-card .icon { font-size: 2rem; }

/* ── Deck Detail / Mode Select ── */
.deck-detail {
  padding: 20px;
  flex: 1;
  display: flex; flex-direction: column;
}
.deck-hero {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.deck-hero .icon { font-size: 3rem; margin-bottom: 12px; }
.deck-hero h2 { font-size: 1.3rem; margin-bottom: 4px; }
.deck-hero .meta { font-size: 0.85rem; color: var(--text-mid); }
.mode-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
.mode-btn {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  display: flex; align-items: center; gap: 16px;
  transition: var(--transition);
  text-align: left;
}
.mode-btn:hover { border-color: var(--primary); background: var(--primary-light); }
.mode-btn .mode-icon { font-size: 2rem; }
.mode-btn .mode-info h3 { font-size: 1rem; font-weight: 600; }
.mode-btn .mode-info p { font-size: 0.82rem; color: var(--text-mid); }
.session-settings {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-top: 16px;
  display: flex; align-items: center; gap: 12px;
  font-size: 0.88rem;
}
.session-settings label { color: var(--text-mid); flex: 1; }
.session-settings select, .session-settings input {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.88rem;
  background: var(--bg);
}
.delete-deck-btn {
  margin-top: auto;
  padding: 12px;
  background: none;
  border: none;
  color: var(--error);
  font-size: 0.85rem;
  cursor: pointer;
  opacity: 0.7;
}
.delete-deck-btn:hover { opacity: 1; }

/* ── Loading ── */
.loading-view {
  flex: 1;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px;
  text-align: center;
  gap: 20px;
}
.spinner {
  width: 48px; height: 48px;
  border: 4px solid var(--primary-light);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-view p { color: var(--text-mid); font-size: 0.95rem; }

/* ── Session (Quiz/Study) ── */
.session-view {
  flex: 1;
  display: flex; flex-direction: column;
  padding: 0 0 20px;
}
.session-topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px;
  position: sticky; top: 0;
  background: var(--bg);
  z-index: 10;
}
.session-progress-wrap { flex: 1; }
.session-progress {
  height: 6px; background: #e8e5de; border-radius: 3px; overflow: hidden;
}
.session-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #66bb6a);
  border-radius: 3px;
  transition: width 0.4s ease;
}
.session-count { font-size: 0.82rem; color: var(--text-mid); font-weight: 500; margin-top: 2px; }
.streak-badge {
  background: var(--accent-light);
  color: #e65100;
  font-size: 0.82rem;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 12px;
  white-space: nowrap;
}

.card-area {
  flex: 1;
  padding: 0 20px;
  display: flex; flex-direction: column;
}
.species-photo-wrap {
  width: 100%;
  aspect-ratio: 4/3;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  margin-bottom: 20px;
  background: #ddd;
  position: relative;
}
.species-photo {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: opacity 0.3s ease;
}
.photo-loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: #e8e5de;
  color: var(--text-light);
  font-size: 2rem;
}
.photo-counter {
  position: absolute; bottom: 10px; right: 10px;
  background: rgba(0,0,0,0.5);
  color: white;
  font-size: 0.75rem;
  padding: 3px 8px;
  border-radius: 10px;
}

/* Quiz options */
.quiz-prompt {
  text-align: center;
  font-size: 1.1rem;
  font-weight: 500;
  margin-bottom: 16px;
  color: var(--text);
}
.options-list { display: flex; flex-direction: column; gap: 10px; }
.option-btn {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: left;
  font-size: 0.95rem;
  position: relative;
}
.option-btn:hover:not(.disabled) {
  border-color: var(--primary);
  background: var(--primary-light);
  transform: translateX(4px);
}
.option-btn .sci-name {
  font-size: 0.8rem;
  color: var(--text-light);
  font-style: italic;
  margin-top: 2px;
}
.option-btn.correct {
  border-color: var(--success);
  background: var(--success-light);
  animation: popCorrect 0.4s ease;
}
.option-btn.incorrect {
  border-color: var(--error);
  background: var(--error-light);
  animation: shake 0.4s ease;
}
.option-btn.disabled { pointer-events: none; opacity: 0.6; }
.option-btn.disabled.correct { opacity: 1; }
.option-btn.disabled.show-correct { opacity: 1; border-color: var(--success); background: var(--success-light); }

@keyframes popCorrect {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* Study/flashcard mode */
.study-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: var(--transition);
}
.study-front, .study-back { padding: 24px; }
.study-front {
  text-align: center;
  font-size: 1rem;
  color: var(--text-mid);
}
.study-front p { margin-bottom: 16px; }
.reveal-btn {
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 25px;
  padding: 12px 32px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.reveal-btn:hover { background: var(--primary-dark); transform: scale(1.03); }

.study-back { text-align: center; }
.study-back .common-name { font-size: 1.3rem; font-weight: 700; margin-bottom: 2px; }
.study-back .sci-name { font-size: 0.95rem; color: var(--text-mid); font-style: italic; margin-bottom: 16px; }
.study-back .native-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 0.78rem;
  font-weight: 600;
  margin-bottom: 16px;
}
.study-back .native-badge.native { background: var(--primary-light); color: var(--primary); }
.study-back .native-badge.introduced { background: var(--error-light); color: var(--error); }

.confidence-prompt { font-size: 0.88rem; color: var(--text-mid); margin-bottom: 12px; }
.confidence-buttons { display: flex; gap: 8px; justify-content: center; }
.conf-btn {
  flex: 1;
  padding: 12px 8px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
}
.conf-btn:hover { transform: translateY(-2px); }
.conf-btn .conf-icon { font-size: 1.3rem; display: block; margin-bottom: 4px; }
.conf-btn .conf-label { font-size: 0.75rem; font-weight: 600; }
.conf-btn.conf-yes:hover { border-color: var(--success); background: var(--success-light); }
.conf-btn.conf-sorta:hover { border-color: var(--accent); background: var(--accent-light); }
.conf-btn.conf-no:hover { border-color: var(--error); background: var(--error-light); }

/* Post-answer info */
.info-panel {
  background: var(--bg-card);
  border-radius: var(--radius) var(--radius) 0 0;
  padding: 24px 20px;
  margin-top: 16px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
  animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.info-result {
  text-align: center;
  font-size: 1.1rem;
  font-weight: 600;
  margin-bottom: 16px;
  padding: 8px 16px;
  border-radius: var(--radius-sm);
}
.info-result.correct { background: var(--success-light); color: var(--success); }
.info-result.incorrect { background: var(--error-light); color: var(--error); }
.info-species {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.info-thumb {
  width: 56px; height: 56px;
  border-radius: 10px;
  object-fit: cover;
}
.info-names .common { font-weight: 600; font-size: 1rem; }
.info-names .sci { font-size: 0.85rem; color: var(--text-mid); font-style: italic; }
.info-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.info-tag {
  font-size: 0.75rem;
  padding: 4px 10px;
  border-radius: 10px;
  font-weight: 500;
}
.info-tag.native { background: var(--primary-light); color: var(--primary-dark); }
.info-tag.introduced { background: var(--error-light); color: var(--error); }
.info-tag.obs-count { background: #e3f2fd; color: #1565c0; }
.info-tag.box-tag { background: var(--accent-light); color: #e65100; }
.info-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--primary);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 500;
  margin-bottom: 16px;
}
.info-link:hover { text-decoration: underline; }
.next-btn {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 25px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
}
.next-btn:hover { background: var(--primary-dark); }

/* ── Session Summary ── */
.summary-view {
  flex: 1;
  padding: 20px;
  display: flex; flex-direction: column;
  align-items: center;
}
.summary-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 32px 24px;
  text-align: center;
  box-shadow: var(--shadow-lg);
  width: 100%;
  margin-bottom: 20px;
}
.summary-card .big-emoji { font-size: 3rem; margin-bottom: 12px; }
.summary-card h2 { font-size: 1.4rem; margin-bottom: 4px; }
.summary-card .sub { color: var(--text-mid); font-size: 0.9rem; margin-bottom: 20px; }
.summary-stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
.summary-stat {
  padding: 12px 8px;
  background: var(--bg);
  border-radius: var(--radius-sm);
}
.summary-stat .val { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
.summary-stat .label { font-size: 0.75rem; color: var(--text-mid); }
.summary-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.summary-actions .btn-primary {
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 25px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
}
.summary-actions .btn-secondary {
  padding: 14px;
  background: var(--bg-card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 25px;
  font-size: 1rem;
  cursor: pointer;
}

/* ── Create Deck Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } }
.modal-content {
  background: var(--bg);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-width: 520px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px 20px;
  animation: slideUp 0.3s ease;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.modal-header h2 { font-size: 1.2rem; }
.modal-close {
  background: none; border: none;
  font-size: 1.5rem; color: var(--text-light);
  cursor: pointer; padding: 4px;
}
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-mid);
}
.form-input {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.95rem;
  transition: var(--transition);
  background: var(--bg-card);
}
.form-input:focus { outline: none; border-color: var(--primary); }
.search-results {
  margin-top: 8px;
  max-height: 200px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
}
.search-result-item {
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
  transition: var(--transition);
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: var(--primary-light); }
.search-result-item.selected { background: var(--primary-light); font-weight: 600; }
.search-result-item .sub { font-size: 0.78rem; color: var(--text-light); }
.radio-group { display: flex; flex-direction: column; gap: 8px; }
.radio-option {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: var(--transition);
  background: var(--bg-card);
  font-size: 0.9rem;
}
.radio-option:hover { border-color: var(--primary); }
.radio-option.selected { border-color: var(--primary); background: var(--primary-light); }
.radio-option input { display: none; }
.radio-dot {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
}
.radio-option.selected .radio-dot {
  border-color: var(--primary);
}
.radio-option.selected .radio-dot::after {
  content: '';
  position: absolute;
  inset: 3px;
  background: var(--primary);
  border-radius: 50%;
}
.create-deck-submit {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 25px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
}
.create-deck-submit:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Error State ── */
.error-view {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-mid);
}
.error-view .error-icon { font-size: 3rem; margin-bottom: 16px; }
.error-view p { margin-bottom: 16px; }
.retry-btn {
  padding: 10px 24px;
  background: var(--primary);
  color: white;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.9rem;
}

/* ── Utility ── */
.hidden { display: none !important; }
.text-center { text-align: center; }
.mt-auto { margin-top: auto; }
.empty-msg {
  padding: 40px 20px;
  text-align: center;
  color: var(--text-light);
  font-size: 0.9rem;
}

@media (max-width: 400px) {
  .deck-grid { grid-template-columns: 1fr; }
  .summary-stats { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const API_BASE = 'https://api.inaturalist.org/v1';

const PRESETS = [
  {
    id: 'driftless_plants',
    name: 'Driftless Area Plants',
    icon: '🌿',
    description: 'Common plants of the Driftless region',
    query: { place_id: 155136, iconic_taxa: 'Plantae', quality_grade: 'research', rank: 'species', per_page: 200, photos: true }
  },
  {
    id: 'driftless_invasives',
    name: 'Driftless Invasives',
    icon: '⚠️',
    description: 'Non-native invasive plants in the Driftless Area',
    query: { place_id: 155136, iconic_taxa: 'Plantae', introduced: true, quality_grade: 'research', rank: 'species', per_page: 200, photos: true }
  },
  {
    id: 'driftless_trees',
    name: 'Driftless Trees',
    icon: '🌳',
    description: 'Trees & woody plants of the Driftless Area',
    query: { place_id: 155136, taxon_id: 47125, quality_grade: 'research', rank: 'species', per_page: 200, photos: true, term_id: 12, term_value_id: 13 }
  },
  {
    id: 'driftless_animals',
    name: 'Driftless Wildlife',
    icon: '🦌',
    description: 'Animals observed in the Driftless region',
    query: { place_id: 155136, iconic_taxa: 'Animalia', quality_grade: 'research', rank: 'species', per_page: 200, photos: true }
  }

const SR_INTERVALS = [0, 1, 3, 7, 14, 30]; // days per box
const BOX_LABELS = ['New', 'Learning', 'Reviewing', 'Familiar', 'Confident', 'Mastered'];
const DEFAULT_SESSION_SIZE = 15;

// ═══════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════
const Store = {
  _get(key, fallback) {
    try { const v = localStorage.getItem('nid_' + key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }
  },
  _set(key, val) {
    try { localStorage.setItem('nid_' + key, JSON.stringify(val)); } catch {}
  },
  getDecks() { return this._get('decks', []); },
  saveDecks(decks) { this._set('decks', decks); },
  getSR() { return this._get('sr', {}); },
  saveSR(sr) { this._set('sr', sr); },
  getSpeciesCache(deckId) { return this._get('cache_' + deckId, null); },
  saveSpeciesCache(deckId, data) { this._set('cache_' + deckId, { ts: Date.now(), species: data }); },
  getSettings() { return this._get('settings', { sessionSize: DEFAULT_SESSION_SIZE }); },
  saveSettings(s) { this._set('settings', s); },
  getStudyLog() { return this._get('studylog', { sessions: 0, lastDate: null, streak: 0 }); },
  saveStudyLog(l) { this._set('studylog', l); },
};

// ═══════════════════════════════════════════
// iNATURALIST API
// ═══════════════════════════════════════════
const API = {
  async speciesCounts(params) {
    const url = new URL(`${API_BASE}/observations/species_counts`);
    for (const [k, v] of Object.entries(params)) {
      if (v !== undefined && v !== null) url.searchParams.set(k, v);
    }
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!res.ok) throw new Error(`API error ${res.status}`);
    const data = await res.json();
    return data.results || [];
  },

  async searchPlaces(query) {
    if (!query || query.length < 2) return [];
    const url = new URL(`${API_BASE}/places/autocomplete`);
    url.searchParams.set('q', query);
    url.searchParams.set('per_page', '10');
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    return data.results || [];
  },

  async searchTaxa(query) {
    if (!query || query.length < 2) return [];
    const url = new URL(`${API_BASE}/taxa/autocomplete`);
    url.searchParams.set('q', query);
    url.searchParams.set('per_page', '10');
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    return data.results || [];
  },

  async getObservationPhotos(taxonId, placeId, count = 8) {
    const url = new URL(`${API_BASE}/observations`);
    url.searchParams.set('taxon_id', taxonId);
    if (placeId) url.searchParams.set('place_id', placeId);
    url.searchParams.set('quality_grade', 'research');
    url.searchParams.set('photos', 'true');
    url.searchParams.set('per_page', count);
    url.searchParams.set('order', 'random');
    const res = await fetch(url);
    if (!res.ok) return [];
    const data = await res.json();
    return (data.results || [])
      .filter(o => o.photos && o.photos.length > 0)
      .map(o => o.photos[0].url.replace('square', 'medium'));
  },

  getPhotoUrl(taxon, size = 'medium') {
    if (!taxon.default_photo) return null;
    const url = taxon.default_photo.medium_url || taxon.default_photo.url || '';
    return url.replace('square', size).replace('small', size);
  }
};

// ═══════════════════════════════════════════
// SPACED REPETITION
// ═══════════════════════════════════════════
const SR = {
  isDue(cardData) {
    if (!cardData) return true; // new card
    return Date.now() >= (cardData.nextReview || 0);
  },

  update(cardData, quality) {
    // quality: 0=wrong, 1=hard/sorta, 2=easy/knew it
    const d = cardData ? { ...cardData } : { box: 0, correct: 0, incorrect: 0 };
    if (quality === 0) {
      d.box = 0;
      d.incorrect = (d.incorrect || 0) + 1;
    } else {
      d.box = Math.min((d.box || 0) + (quality === 2 ? 2 : 1), 5);
      d.correct = (d.correct || 0) + 1;
    }
    d.lastReview = Date.now();
    const days = SR_INTERVALS[Math.min(d.box, SR_INTERVALS.length - 1)];
    d.nextReview = Date.now() + days * 86400000;
    return d;
  },

  sortByPriority(speciesList, srData) {
    return [...speciesList].sort((a, b) => {
      const ad = srData[a.id], bd = srData[b.id];
      const aDue = this.isDue(ad), bDue = this.isDue(bd);
      const aNew = !ad, bNew = !bd;
      // Due cards first
      if (aDue && !bDue) return -1;
      if (!aDue && bDue) return 1;
      // Then new cards
      if (aNew && !bNew) return -1;
      if (!aNew && bNew) return 1;
      // Lower box = higher priority
      return (ad?.box || 0) - (bd?.box || 0);
    });
  },

  getDeckMastery(speciesList, srData) {
    if (!speciesList || speciesList.length === 0) return { pct: 0, mastered: 0, learning: 0, newCount: 0 };
    let mastered = 0, learning = 0, newCount = 0;
    for (const sp of speciesList) {
      const d = srData[sp.id];
      if (!d) newCount++;
      else if (d.box >= 4) mastered++;
      else learning++;
    }
    return {
      pct: Math.round((mastered / speciesList.length) * 100),
      mastered, learning, newCount,
      total: speciesList.length
    };
  }
};

    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;

    switch (action) {
      case 'goLibrary':
        this.setState({ view: 'library', activeDeck: null, showModal: false });
        break;
      case 'openDeck':
        this.openDeck(target.dataset.deckId);
        break;
      case 'startSession':
        this.startSession(target.dataset.mode);
        break;
      case 'selectAnswer':
        this.selectAnswer(parseInt(target.dataset.index));
        break;
      case 'revealCard':
        this.setState({ revealed: true });
        break;
      case 'rateConfidence':
        this.rateConfidence(parseInt(target.dataset.quality));
        break;
      case 'nextCard':
        this.nextCard();
        break;
      case 'endSession':
        this.goToSummary();
        break;
      case 'createDeck':
        this.setState({
          showModal: true,
          modalPlaceResults: [],
          modalTaxaResults: [],
          modalSelectedPlace: null,
          modalSelectedCategory: 'all_plants',
          modalSelectedTaxon: null
        });
        break;
      case 'closeModal':
        if (e.target === e.currentTarget || target.classList.contains('modal-close'))
          this.setState({ showModal: false });
        break;
      case 'selectPlace':
        this.setState({
          modalSelectedPlace: { id: parseInt(target.dataset.placeId), name: target.dataset.placeName },
          modalPlaceResults: []
        });
        break;
      case 'selectCategory':
        this.setState({ modalSelectedCategory: target.dataset.category });
        break;
      case 'selectTaxon': {
        const id = parseInt(target.dataset.taxonId);
        const t = this.state.modalTaxaResults.find(t => t.id === id);
        this.setState({ modalSelectedTaxon: t || { id, name: target.dataset.taxonSci, preferred_common_name: target.dataset.taxonName }, modalTaxaResults: [] });
        break;
      }
      case 'submitCreateDeck':
        this.submitCreateDeck();
        break;
      case 'deleteDeck':
        this.deleteDeck(target.dataset.deckId);
        break;
    }
  },

  _searchTimeout: null,
  handleInput(e) {
    const target = e.target;
    if (target.dataset.action === 'searchPlace') {
      clearTimeout(this._searchTimeout);
      this._searchTimeout = setTimeout(async () => {
        const results = await API.searchPlaces(target.value);
        this.state.modalPlaceResults = results;
        this.render();
        const el = document.getElementById('placeSearch');
        if (el) { el.value = target.value; el.focus(); }
      }, 300);
    }
    if (target.dataset.action === 'searchTaxa') {
      clearTimeout(this._searchTimeout);
      this._searchTimeout = setTimeout(async () => {
        const results = await API.searchTaxa(target.value);
        this.state.modalTaxaResults = results;
        this.render();
        const el = document.getElementById('taxonSearch');
        if (el) { el.value = target.value; el.focus(); }
      }, 300);
    }
  },

  handleChange(e) {
    if (e.target.dataset.action === 'setSessionSize') {
      const settings = Store.getSettings();
      settings.sessionSize = parseInt(e.target.value);
      Store.saveSettings(settings);
    }
  },

  // ── ACTIONS ──
  openDeck(deckId) {
    const deck = PRESETS.find(p => p.id === deckId) || Store.getDecks().find(d => d.id === deckId);
    if (!deck) return;
    this.setState({ view: 'deckDetail', activeDeck: deck });
  },

  async startSession(mode) {
    const deck = this.state.activeDeck;
    if (!deck) return;

    this.setState({ view: 'loading' });

    try {
      let species = [];
      const cache = Store.getSpeciesCache(deck.id);
      const cacheAge = cache ? Date.now() - cache.ts : Infinity;

      // Use cache if less than 2 hours old
      if (cache && cacheAge < 7200000) {
        species = cache.species;
      } else {
        const results = await API.speciesCounts(deck.query);
        species = results
          .filter(r => r.taxon && r.taxon.default_photo && r.taxon.preferred_common_name)
          .map(r => ({
            id: r.taxon.id,
            sciName: r.taxon.name,
            commonName: r.taxon.preferred_common_name,
            defaultPhoto: API.getPhotoUrl(r.taxon),
            obsCount: r.count,
            introduced: r.taxon.introduced || false,
            iconic: r.taxon.iconic_taxon_name,
            wikipediaUrl: r.taxon.wikipedia_url,
            ancestry: r.taxon.ancestry,
          }));
        Store.saveSpeciesCache(deck.id, species);
      }

      if (species.length < 4) {
        this.setState({ view: 'error', errorMessage: `Only found ${species.length} species with photos. Try a broader search or different region.` });
        return;
      }

      // Build session cards using spaced repetition priority
      const sr = Store.getSR();
      const sorted = SR.sortByPriority(species, sr);
      const sessionSize = Math.min(Store.getSettings().sessionSize, sorted.length);
      const sessionSpecies = sorted.slice(0, sessionSize);

      // For each session species, build a card
      const sessionCards = sessionSpecies.map(sp => {
        // Pick 3 wrong answers, preferring same iconic taxon
        const sameGroup = species.filter(s => s.id !== sp.id && s.iconic === sp.iconic);
        const otherGroup = species.filter(s => s.id !== sp.id);
        const pool = sameGroup.length >= 3 ? sameGroup : otherGroup;
        const wrongAnswers = this.shuffleArray(pool).slice(0, 3);
        const options = this.shuffleArray([
          { commonName: sp.commonName, sciName: sp.sciName, id: sp.id },
          ...wrongAnswers.map(w => ({ commonName: w.commonName, sciName: w.sciName, id: w.id }))
        ]);
        const correctIndex = options.findIndex(o => o.id === sp.id);

        return {
          ...sp,
          photoUrl: sp.defaultPhoto,
          options,
          correctIndex,
        };
      });

      // Try to fetch varied photos for session cards (non-blocking)
      this.fetchVariedPhotos(sessionCards, deck.query.place_id);

      this.setState({
        view: 'session',
        sessionMode: mode,
        sessionCards,
        cardIndex: 0,
        sessionScore: 0,
        sessionStreak: 0,
        answered: false,
        revealed: false,
        selectedAnswer: -1,
      });
    } catch (err) {
      console.error('Failed to start session:', err);
      this.setState({ view: 'error', errorMessage: 'Could not load species data. The iNaturalist API might be temporarily unavailable.' });
    }
  },

  async fetchVariedPhotos(cards, placeId) {
    // Background: try to get a random observation photo for each card
    for (let i = 0; i < Math.min(cards.length, 5); i++) {
      try {
        const photos = await API.getObservationPhotos(cards[i].id, placeId, 4);
        if (photos.length > 0) {
          const randomPhoto = photos[Math.floor(Math.random() * photos.length)];
          cards[i].photoUrl = randomPhoto;
          if (this.state.view === 'session' && this.state.cardIndex === i && !this.state.answered && !this.state.revealed) {
            this.render();
          }
        }
      } catch {}
    }
  },

  selectAnswer(index) {
    if (this.state.answered) return;
    const card = this.state.sessionCards[this.state.cardIndex];
    const isCorrect = index === card.correctIndex;

    // Update SR
    const sr = Store.getSR();
    sr[card.id] = SR.update(sr[card.id], isCorrect ? 2 : 0);
    Store.saveSR(sr);

    this.setState({
      answered: true,
      selectedAnswer: index,
      sessionScore: this.state.sessionScore + (isCorrect ? 1 : 0),
      sessionStreak: isCorrect ? this.state.sessionStreak + 1 : 0,
    });
  },

  rateConfidence(quality) {
    const card = this.state.sessionCards[this.state.cardIndex];
    const sr = Store.getSR();
    sr[card.id] = SR.update(sr[card.id], quality);
    Store.saveSR(sr);

    const isCorrect = quality >= 1;
    this.setState({
      answered: true,
      sessionScore: this.state.sessionScore + (quality >= 2 ? 1 : 0),
      sessionStreak: quality >= 2 ? this.state.sessionStreak + 1 : (quality === 0 ? 0 : this.state.sessionStreak),
    });
  },

  nextCard() {
    const nextIndex = this.state.cardIndex + 1;
    if (nextIndex >= this.state.sessionCards.length) {
      this.goToSummary();
      return;
    }
    this.setState({
      cardIndex: nextIndex,
      answered: false,
      revealed: false,
      selectedAnswer: -1,
    });
  },

  goToSummary() {
    // Update study log
    const log = Store.getStudyLog();
    const today = new Date().toDateString();
    log.sessions = (log.sessions || 0) + 1;
    if (log.lastDate !== today) {
      const yesterday = new Date(Date.now() - 86400000).toDateString();
      log.streak = log.lastDate === yesterday ? (log.streak || 0) + 1 : 1;
      log.lastDate = today;
    }
    Store.saveStudyLog(log);
    this.setState({ view: 'summary' });
  },

  submitCreateDeck() {
    const s = this.state;
    const nameEl = document.getElementById('deckName');
    const name = nameEl?.value?.trim() || `Custom Deck ${Date.now() % 1000}`;
    const place = s.modalSelectedPlace;
    if (!place) return;

    const query = { place_id: place.id, quality_grade: 'research', rank: 'species', per_page: 200, photos: true };

    switch (s.modalSelectedCategory) {
      case 'all_plants':
        query.iconic_taxa = 'Plantae';
        break;
      case 'invasive_plants':
        query.iconic_taxa = 'Plantae';
        query.introduced = true;
        break;
      case 'all_animals':
        query.iconic_taxa = 'Animalia';
        break;
      case 'all_life':
        // no filter
        break;
      case 'custom_taxon':
        if (s.modalSelectedTaxon) query.taxon_id = s.modalSelectedTaxon.id;
        break;
    }

    const deck = {
      id: 'custom_' + Date.now(),
      name,
      icon: s.modalSelectedCategory === 'invasive_plants' ? '⚠️' :
            s.modalSelectedCategory === 'all_animals' ? '🦌' :
            s.modalSelectedCategory === 'custom_taxon' ? '🔍' : '🌿',
      description: `${place.name}${s.modalSelectedCategory === 'invasive_plants' ? ' · Invasives' : ''}`,
      query,
    };

    const decks = Store.getDecks();
    decks.push(deck);
    Store.saveDecks(decks);

    this.setState({ showModal: false, view: 'library' });
  },

  deleteDeck(deckId) {
    if (!confirm('Delete this custom deck?')) return;
    const decks = Store.getDecks().filter(d => d.id !== deckId);
    Store.saveDecks(decks);
    try { localStorage.removeItem('nid_cache_' + deckId); } catch {}
    this.setState({ view: 'library', activeDeck: null });
  },

  // ── UTILS ──
  shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
};

// ── INIT ──
App.init();
</script>
</body>
